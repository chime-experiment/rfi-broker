---
name: rfi-broker-ci-tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # CARGO_INCREMENTAL: 0

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v4
      # - uses: Swatinem/rust-cache@v2
        # with:
          # share cache across jobs
          # shared-key: "ci-cache"
          # prevent cross-os issues
          # prefix-key: "${{ runner.os }}-rust wv"
      - run: just ci-clippy

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: extractions/setup-just@v4
      # - uses: Swatinem/rust-cache@v2
        # with:
          # share cache across jobs
          # shared-key: "ci-cache"
          # prevent cross-os issues
          # prefix-key: "${{ runner.os }}-rust wv"
      - name: Run unit tests
        run: just ci-test
