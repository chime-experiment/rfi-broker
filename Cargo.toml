[package]
name = "rfi-receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
binrw = "0.15.1"
chrono = "0.4.44"
clap = { version = "4.6", features = ["derive"] }
config = "0.15.22"
eyre = "0.6.12"
mimalloc = "0.1.50"
ndarray = { version = "0.17.2", features = ["serde"] }
ndarray-npy = "0.10.0"
num-traits = "0.2.19"
parking_lot = "0.12.5"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.3"
sunrise = "3.0.0"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tracing-test = "0.2.6"
ndarray = { version = "0.17.2", features = ["approx"] }
approx = "0.5"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.release-with-debug-info]
inherits = "release"
lto = "thin"
debug-assertions = true

[lints.clippy]
# Enable all pedantic warnings
pedantic = { level = "warn", priority = -1 }

# Enable specific selection from `restriction`
# Unfinished code and style
expect_used      = "deny"
unwrap_used      = "deny"
panic            = "deny"
todo             = "warn"
unimplemented    = "warn"
# Code safety
integer_division         = "warn"  # flag truncating integer division
string_slice             = "warn"  # flag non-char-boundary string slicing
indexing_slicing         = "warn"  # flag unchecked [] indexing
# Clarity
else_if_without_else       = "warn"  # enforce exhaustive if-else chains
allow_attributes_without_reason = "warn"  # every #[allow] must have reason = "..."

# Enable specific selection from `nursary`
# Performance
suboptimal_flops           = "warn"  # suggest faster float ops (e.g. x.mul_add)
missing_const_for_fn       = "warn"  # suggest const fn where possible (noisy!)
# Quality
use_self                   = "warn"  # use Self instead of the type name in impls
option_if_let_else         = "warn"  # suggest .map_or_else over if let
redundant_pub_crate        = "warn"  # flag unnecessary pub(crate) visibility
