[package]
name = "http-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
binrw = "0.14"
clap = { version = "4.6", features = ["derive"] }
indexmap = "2.13.0"
ndarray = { version = "0.15", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
